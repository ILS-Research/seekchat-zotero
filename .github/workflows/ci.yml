# CI for SeekChat on GitHub, like .gitlab-ci.yml: unit tests, typecheck and E2E tests (real Zotero under Xvfb, mock
# LLM) on every push; on a tag vX.Y.Z or vX.Y.Z-rc.N after green tests a GitHub release with the .xpi.
# Installed plugins update from gitlab.com (manifest.json update_url); this release is a second download place.
# The live practice test needs ollama.ils.local and stays on GitLab (job e2e-live).
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      zotero_version:
        description: Zotero version of the E2E image (7.0.32, 8.0.4, 9.0.4, 10.0.3)
        default: '10.0.3'
      release_tag:
        description: Build, test and release this existing tag (e.g. one made before this workflow existed)
        default: ''

env:
  ZOTERO_VERSION: ${{ inputs.zotero_version || '10.0.3' }}
  # The tag to release: the pushed tag, or the one given when started by hand.
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      # Build image (Node + zip + in-house CAs); docker/certs is generated from e2e/certs as in build.sh.
      - name: Build image
        run: |
          rm -rf docker/certs && mkdir -p docker/certs && cp e2e/certs/*.crt docker/certs/
          docker build -q -t seekchat-build:ci docker/
      - name: Unit tests, typecheck, build
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src -e HOME=/tmp -e npm_config_update_notifier=false \
            seekchat-build:ci bash -c 'npm ci --no-audit --no-fund && npm test && npm run typecheck && npm run build -- --pack && npm run build -- --pack --e2e'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: E2E (Zotero ${{ env.ZOTERO_VERSION }})
        run: |
          docker build --build-arg ZOTERO_VERSION="$ZOTERO_VERSION" -t seekchat-e2e:ci e2e/
          # Like e2e/run.sh, but with docker cp: the E2E build of the plugin in, results out.
          cid=$(docker create -e E2E_TIMEOUT=600 seekchat-e2e:ci)
          docker cp dist/. "$cid:/dist"
          status=0; docker start -a "$cid" || status=$?
          mkdir -p e2e/out && docker cp "$cid:/out/." e2e/out/ || true
          docker rm -f "$cid" >/dev/null
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-out
          path: e2e/out/
          retention-days: 14

  release:
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SEMVER="${RELEASE_TAG#v}"
          echo "$SEMVER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$' || { echo "not a release tag: $RELEASE_TAG"; exit 1; }
          # The tag must match package.json (the only source of the version).
          test "$(jq -r .version package.json)" = "$SEMVER" || { echo "tag $RELEASE_TAG does not match package.json"; exit 1; }
          VERSION="$(echo "$SEMVER" | sed -E 's/-([a-z]+)\.?([0-9]+)$/\1\2/')"
          XPI="dist/seekchatzot-$VERSION.xpi"
          test -f "$XPI"
          awk -v v="## $SEMVER " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          PRE=""; [ "$VERSION" != "$SEMVER" ] && PRE="--prerelease"
          gh release create "$RELEASE_TAG" "$XPI" --title "SeekChatZot $VERSION" --notes-file notes.md $PRE
